name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Dependency audit summary
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,via:v.via,effects:v.effects,nodes:v.nodes,fixAvailable:v.fixAvailable}));"
      - run: npm run typecheck
      - run: npm run build
        env:
          TURSO_DATABASE_URL: file:./ci.db
          TURSO_AUTH_TOKEN: ci-placeholder
          MCP_AUTH_TOKEN: ci-placeholder
